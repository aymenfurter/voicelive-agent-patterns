{{ if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({
    startOnLoad: true,
    theme: 'base',
    themeVariables: {
      fontFamily: 'Outfit, system-ui, sans-serif',
      fontSize: '15px',
      primaryColor: '#1C1A15',
      primaryTextColor: '#EDE8DF',
      primaryBorderColor: '#E5A922',
      lineColor: '#A49780',
      secondaryColor: '#13120E',
      tertiaryColor: '#0A0908',
      noteBkgColor: '#1C1A15',
      noteTextColor: '#F2C14E',
      noteBorderColor: '#E5A922',
      actorBkg: '#1C1A15',
      actorBorder: '#E5A922',
      actorTextColor: '#EDE8DF',
      actorLineColor: '#6D6150',
      signalColor: '#EDE8DF',
      signalTextColor: '#EDE8DF',
      labelBoxBkgColor: '#13120E',
      labelBoxBorderColor: '#E5A922',
      labelTextColor: '#F2C14E',
      loopTextColor: '#A49780',
      activationBkgColor: '#302B22',
      activationBorderColor: '#E5A922',
      sequenceNumberColor: '#000',
    },
    sequence: {
      mirrorActors: false,
      useMaxWidth: true,
      wrap: true,
      actorMargin: 70,
      messageMargin: 40,
      boxMargin: 12,
      noteMargin: 12,
      width: 160,
      height: 52,
      messageFontSize: 13,
      actorFontSize: 14,
      noteFontSize: 12,
    },
    flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' }
  });
</script>
<div class="mermaid-modal" id="mermaidModal" hidden>
  <div class="mermaid-modal__toolbar">
    <button type="button" data-zoom="out" aria-label="Zoom out">−</button>
    <button type="button" data-zoom="reset" aria-label="Reset zoom">Reset</button>
    <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
    <button type="button" data-zoom="close" aria-label="Close" class="mermaid-modal__close">Close ✕</button>
  </div>
  <div class="mermaid-modal__viewport">
    <div class="mermaid-modal__stage" id="mermaidModalStage"></div>
  </div>
</div>
<script>
(() => {
  const modal = document.getElementById('mermaidModal');
  const stage = document.getElementById('mermaidModalStage');
  if (!modal || !stage) return;
  let scale = 1;
  const apply = () => { stage.style.transform = `scale(${scale})`; };
  const open = (svg) => {
    stage.innerHTML = '';
    const clone = svg.cloneNode(true);
    clone.removeAttribute('style');
    clone.style.height = 'auto';
    clone.style.maxWidth = 'none';
    // Mermaid SVGs use viewBox; preserve intrinsic size on the clone so flex centering works.
    const vb = clone.viewBox && clone.viewBox.baseVal;
    if (vb && vb.width) {
      clone.setAttribute('width', vb.width);
      clone.setAttribute('height', vb.height);
      clone.style.width = vb.width + 'px';
    }
    stage.appendChild(clone);
    scale = 1; apply();
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
  };
  const close = () => {
    modal.hidden = true;
    stage.innerHTML = '';
    document.body.style.overflow = '';
  };
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.mermaid-wrap__zoom');
    if (btn) {
      const wrap = btn.closest('.mermaid-wrap');
      const svg = wrap?.querySelector('.mermaid-wrap__scroll svg');
      if (svg) open(svg);
      return;
    }
    const action = e.target.closest('[data-zoom]');
    if (!action) return;
    const kind = action.dataset.zoom;
    if (kind === 'in')    { scale = Math.min(4, scale * 1.25); apply(); }
    if (kind === 'out')   { scale = Math.max(0.3, scale / 1.25); apply(); }
    if (kind === 'reset') { scale = 1; apply(); }
    if (kind === 'close') close();
  });
  document.addEventListener('keydown', (e) => {
    if (modal.hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === '+' || e.key === '=') { scale = Math.min(4, scale * 1.25); apply(); }
    if (e.key === '-') { scale = Math.max(0.3, scale / 1.25); apply(); }
    if (e.key === '0') { scale = 1; apply(); }
  });
  modal.addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    scale = Math.min(4, Math.max(0.3, scale * (e.deltaY < 0 ? 1.1 : 1/1.1)));
    apply();
  }, { passive: false });
})();
</script>
{{ end }}
